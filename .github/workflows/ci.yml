name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ addon/ tests/ scripts/ examples/
      - name: Ruff format check
        run: ruff format --check src/ addon/ tests/ scripts/ examples/
      - name: Shellcheck
        run: shellcheck -x -P scripts scripts/*.sh
      - name: Mypy
        run: mypy src/ addon/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage (server + add-on)
        run: pytest -v
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    name: Blender ${{ matrix.version }} on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: "3.6"
            version: "3.6.23"
            sha256: "0e9a18af4d0060b825e9617e24a775f759e0f9f67271c062f3d53a539030af00"
          - series: "4.5"
            version: "4.5.3"
            sha256: "975c58fcb244273838534bba771e64ad87739216b0f9b39a888531a49a72d845"
          - series: "5.0"
            version: "5.0.0"
            sha256: "9de96e81432afba9c0a715c7233f1eff616705b75226dc5d0fa2708ddfb0e525"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Blender and test dependencies
        shell: bash
        env:
          SERIES: ${{ matrix.series }}
          VERSION: ${{ matrix.version }}
          CHECKSUM: ${{ matrix.sha256 }}
        run: |
          mkdir -p blender-logs
          archive="blender-$VERSION-linux-x64.tar.xz"
          downloaded=no
          for host in https://mirror.blender.org/release https://download.blender.org/release https://mirrors.ocf.berkeley.edu/blender/release; do
            url="$host/Blender$SERIES/$archive"
            echo "Downloading $url" | tee -a blender-logs/download.log
            if curl --silent --show-error --fail --location --retry 2 --max-time 150 "$url" -o "$RUNNER_TEMP/$archive" 2>&1 | tee -a blender-logs/download.log &&
              echo "$CHECKSUM  $RUNNER_TEMP/$archive" | sha256sum --check 2>&1 | tee -a blender-logs/download.log; then
              downloaded=yes
              break
            fi
          done
          test "$downloaded" = yes
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          binary="$RUNNER_TEMP/blender-$VERSION-linux-x64/blender"
          "$binary" --version | tee blender-logs/version.txt
          echo "BLENDER_BIN=$binary" >> "$GITHUB_ENV"
          pip install -e ".[dev]"
      - name: Run end-to-end tests against Blender
        env:
          BLENDER_MCP_INTEGRATION: "1"
          BLENDER_MCP_TEST_LOG_DIR: blender-logs
        run: pytest tests/integration -v --no-cov --junitxml=blender-logs/results.xml
      - name: Upload Blender version and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-${{ matrix.version }}-linux
          path: blender-logs

  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Blender 4.5.3
        shell: pwsh
        run: |
          New-Item blender-logs -ItemType Directory | Out-Null
          $name = 'blender-4.5.3-windows-x64'
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://download.blender.org/release/Blender4.5/$name.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '6b657c8bdd3a7b65b07b9e1ae17eb4be7dd4aa23121da7f3d3354fc2551330a7') {
            throw 'Blender checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $binary = Join-Path $env:RUNNER_TEMP "$name/blender.exe"
          & $binary --version | Tee-Object blender-logs/version.txt
          "BLENDER_BIN=$binary" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Verify installer syntax, setup and private token access
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/windows.ps1), [ref]$tokens, [ref]$errors
          )
          if ($errors) { throw ($errors -join [Environment]::NewLine) }
          $env:BLENDER_USER_RESOURCES = Join-Path $env:RUNNER_TEMP 'launcher-blender-profile'
          ./scripts/windows.ps1 Setup -Port 19876
          $config = Get-Content .venv/blender-mcp.json -Raw | ConvertFrom-Json
          $entry = $config.mcpServers.blender
          if (-not (Test-Path $entry.command) -or $entry.env.BLENDER_MCP_PORT -ne '19876') {
            throw 'Invalid MCP client configuration'
          }
          $acl = Get-Acl -LiteralPath $entry.env.BLENDER_MCP_TOKEN_FILE
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $rules = $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])
          if (-not $acl.AreAccessRulesProtected -or $rules.Count -ne 1 -or $rules[0].IdentityReference -ne $sid) {
            throw 'Token file ACL is not private'
          }
          ./scripts/windows.ps1 Stop
      - name: Authenticate and query the installed add-on
        env:
          BLENDER_MCP_INTEGRATION: "1"
          BLENDER_MCP_TEST_LOG_DIR: blender-logs
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests/integration/test_packaging.py -v --no-cov --junitxml=blender-logs/results.xml
      - name: Upload Windows installation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-4.5.3-windows
          path: blender-logs

  build:
    needs: [lint, test, integration, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          pip install build
          python -m build
      - name: Verify the installed wheel loads its packaged data
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/check_wheel.py"
      - name: Verify the Docker image builds with its packaged data
        run: |
          docker build -t blender-mcp-server:ci .
          docker run --rm --entrypoint python blender-mcp-server:ci -c \
            "from blender_mcp_server import knowledge, recipes; assert knowledge.guides() and all(r.path.is_file() for r in recipes.catalog().values())"
      - name: Build Blender add-on zip
        run: ./scripts/build_addon_zip.sh
      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Upload add-on zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blender-addon
          path: dist/blender_mcp_bridge.zip
